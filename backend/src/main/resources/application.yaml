server:
  port: ${PORT:8080}

bot:
  app-id: ${BOT_APP_ID:0}
  private-key: ${BOT_PRIVATE_KEY:}
  webhook-secret: ${BOT_WEBHOOK_SECRET:}

datasource:
  url: ${DB_URL:jdbc:h2:mem:octobird;DB_CLOSE_DELAY=-1}
  username: ${DB_USERNAME:sa}
  password: ${DB_PASSWORD:}
  driver: ${DB_DRIVER:org.h2.Driver}
